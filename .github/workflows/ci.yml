name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (tag in the comment): a
# moved or compromised tag cannot change what runs here. Bump them by hand.

# Cancel superseded runs on the same branch/PR to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Run bundled JavaScript actions (checkout, upload/download-artifact) on
  # Node 24. Their v5 releases still ship Node 20, deprecated by GitHub and
  # forced to Node 24 from 2026-06-02. This opts in early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # fmt and clippy are platform-independent; run them once on the cheapest
  # runner instead of across the whole OS matrix.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      # Known-vulnerable dependencies fail the build (ammonia is the only
      # thing standing between a hostile email and the browser). Prebuilt
      # binary, so this adds seconds, not a compile.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --locked
