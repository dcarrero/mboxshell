name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # Run bundled JavaScript actions (checkout, upload/download-artifact) on
  # Node 24. Their v5 releases still ship Node 20, deprecated by GitHub and
  # forced to Node 24 from 2026-06-02. This opts in early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: building runs third-party build scripts and tools, so it
# only reads; just the job that publishes the release can write. Actions are
# pinned to a commit SHA (tag in the comment).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mboxshell-linux-x86_64
            cross: false
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mboxshell-linux-aarch64
            cross: true
          # Linux RISC-V 64
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            artifact: mboxshell-linux-riscv64
            cross: true
          # FreeBSD x86_64 (via cross)
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            artifact: mboxshell-freebsd-x86_64
            cross: true
          # macOS Intel (cross-compiled on Apple Silicon runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mboxshell-macos-x86_64
            cross: false
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mboxshell-macos-aarch64
            cross: false
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mboxshell-windows-x86_64.exe
            cross: false
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: mboxshell-windows-arm64.exe
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Cross-compilation toolchains
      - name: Install cross-compilation tools
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Set linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Set linker for riscv64gc-unknown-linux-gnu
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.riscv64gc-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "riscv64-linux-gnu-gcc"' >> .cargo/config.toml

      # FreeBSD cross-compilation via cross tool (prebuilt binary, pinned by
      # the action — avoids compiling cross from git HEAD on every release)
      - name: Install cross for FreeBSD
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cross

      - name: Build release (cross)
        if: matrix.target == 'x86_64-unknown-freebsd'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build release
        if: matrix.target != 'x86_64-unknown-freebsd'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Rename binary for upload
      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/mboxshell ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/mboxshell.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Collect all binaries
          FILES=""
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              if [ -f "$file" ]; then
                FILES="$FILES $file"
              fi
            done
          done

          gh release create "$TAG" \
            --title "mboxShell $TAG" \
            --notes "## mboxShell $TAG

          Fast terminal viewer for MBOX files of any size.

          ### Downloads

          | Platform | Binary |
          |----------|--------|
          | Linux x86_64 | \`mboxshell-linux-x86_64\` |
          | Linux ARM64 | \`mboxshell-linux-aarch64\` |
          | Linux RISC-V 64 | \`mboxshell-linux-riscv64\` |
          | FreeBSD x86_64 | \`mboxshell-freebsd-x86_64\` |
          | macOS Intel | \`mboxshell-macos-x86_64\` |
          | macOS Apple Silicon | \`mboxshell-macos-aarch64\` |
          | Windows x86_64 | \`mboxshell-windows-x86_64.exe\` |
          | Windows ARM64 | \`mboxshell-windows-arm64.exe\` |

          ### Installation

          \`\`\`bash
          # Homebrew (macOS / Linux)
          brew install dcarrero/tap/mboxshell

          # Scoop (Windows)
          scoop bucket add dcarrero https://github.com/dcarrero/scoop-bucket
          scoop install dcarrero/mboxshell

          # Manual (Linux / macOS)
          chmod +x mboxshell-*
          sudo mv mboxshell-* /usr/local/bin/mboxshell

          # Or build from source (crates.io)
          cargo install mboxshell
          \`\`\`

          ### What's included

          - Streaming MBOX parser (handles 50GB+ files)
          - Persistent binary index for instant re-opens
          - Gmail labels support (X-Gmail-Labels)
          - Advanced search (from:, subject:, date:, body:, has:attachment, etc.)
          - Conversation threading (JWZ algorithm)
          - Export to EML, TXT, CSV, HTML, a new MBOX or a Maildir, with attachment extraction
          - Full terminal UI with vi-style navigation
          - Bilingual interface (English/Spanish)
          " \
            $FILES

  # Publishes the crate to crates.io. Needs CARGO_REGISTRY_TOKEN, a crates.io
  # token scoped to the mboxshell crate (publish-new + publish-update); without
  # it the job is skipped. A version that is already on crates.io (a tag moved
  # to a later commit) is skipped too, since crates.io never takes it twice.
  crates:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; crate not published"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mboxshell") | .version')
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml says $VERSION but the tag is $TAG"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mboxshell-release (https://github.com/dcarrero/mboxshell)" \
            "https://crates.io/api/v1/crates/mboxshell/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "mboxshell $VERSION is already on crates.io"
            exit 0
          fi
          cargo publish --locked

  # Updates the Homebrew formula (dcarrero/homebrew-tap) and the Scoop
  # manifest (dcarrero/scoop-bucket) from the binaries just published. A
  # separate job: if it fails, the release itself is already out. Pushing to
  # those repos needs HOMEBREW_TAP_TOKEN, a fine-grained token with
  # "Contents: read and write" on both; without it the job is skipped.
  packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Update Homebrew tap and Scoop bucket
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; tap and bucket not updated"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          gh release download "$TAG" --dir assets \
            -p 'mboxshell-macos-*' -p 'mboxshell-linux-x86_64' \
            -p 'mboxshell-linux-aarch64' -p 'mboxshell-windows-*'
          .github/scripts/package-manifests.sh "$TAG" assets out

          publish() { # <repo> <file> <dest-dir>
            git clone -q --depth 1 "https://x-access-token:${PUSH_TOKEN}@github.com/$1.git" "work-$1"
            cp "$2" "work-$1/$3/"
            cd "work-$1"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "$1 already up to date"
            else
              git commit -qm "mboxshell ${TAG#v}"
              git push -q
            fi
            cd "$GITHUB_WORKSPACE"
          }
          publish dcarrero/homebrew-tap out/mboxshell.rb Formula
          publish dcarrero/scoop-bucket out/mboxshell.json bucket
