[package]
name = "mboxshell"
version = "1.4.0"
edition = "2021"
rust-version = "1.88"
description = "Fast terminal viewer for MBOX files of any size. Open, search and export emails from Gmail Takeout backups (50GB+) without loading them into memory."
license = "MIT"
authors = ["David Carrero Fernández-Baillo"]
repository = "https://github.com/dcarrero/mboxshell"
homepage = "https://github.com/dcarrero/mboxshell"
keywords = ["mbox", "email", "tui", "terminal", "viewer"]
categories = ["command-line-utilities", "email"]
readme = "README.md"
# What goes to crates.io: the code and what the crate page links to. Fixtures,
# docs, CI and local notes stay in the repository.
include = [
    "/src/**/*.rs",
    "/benches/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README-ES.md",
    "/CHANGELOG.md",
    "/CHANGELOG-ES.md",
]

# `cargo binstall mboxshell` downloads the release binary instead of compiling.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-macos-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-linux-aarch64"

[package.metadata.binstall.overrides.riscv64gc-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-linux-riscv64"

[package.metadata.binstall.overrides.x86_64-unknown-freebsd]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-freebsd-x86_64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-windows-x86_64.exe"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mboxshell-windows-arm64.exe"

[dependencies]
# Email parsing
mail-parser = "0.9"
encoding_rs = "0.8"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# Index entries (compact, varint-encoded; replaces the unmaintained bincode)
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Hashing for index integrity
sha2 = "0.10"
# The index is authenticated with a per-user key, so one shipped next to a
# mailbox is rebuilt instead of trusted
hmac = "0.12"
getrandom = "0.3"

# Fast newline scanning when streaming a mailbox (already in the tree through serde_json)
memchr = "2"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Progress
indicatif = "0.18"

# Cross-platform directories
dirs = "5"

# Config
toml = "0.8"

# Shell completions & manpage
clap_complete = "4"
clap_mangen = "0.2"

# Logging to file
tracing-appender = "0.2"

# Utilities
humansize = "2"
lru = "0.18"
unicode-width = "0.2"

# HTML to text rendering (tables, lists, links)
html2text = "0.12"

# Quoted-printable encoding for EML export
quoted_printable = "0.5"

# HTML sanitization for exported messages (strip scripts, on* handlers, etc.)
ammonia = "4"
# Inline (`cid:`) images embedded as `data:` URIs in HTML exports
base64 = "0.22"

# TUI
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, used by the
# message view to compute wrap-aware scroll offsets (so in-body search `n`/`N`
# reliably brings a match into view on messages with long, wrapped lines).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
# SIGTERM/SIGHUP/SIGINT while the TUI owns the terminal (already in the tree
# through crossterm; only its safe flag API is used)
signal-hook = "0.3"

# SHA-256 with the ARMv8 crypto extensions on Apple Silicon and Linux ARM
# (x86_64 detects SHA-NI by itself). Without this the hash runs in software
# there, about six times slower: it is what `merge` spends its time on and
# what authenticates the index at every start. Needs a C compiler at build
# time on those targets only.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "macos", target_os = "linux")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# Distributed binaries: smaller and faster at the cost of slower release
# builds (only paid on tag pushes).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
assert_fs = "1"
predicates = "3"

[[bench]]
name = "parsing"
harness = false

# No `unsafe` in mboxshell itself: a forbid can't be overridden by an inner allow.
[lints.rust]
unsafe_code = "forbid"
